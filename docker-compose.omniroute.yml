# Full stack setup with OmniRoute in Docker
# Run with: docker-compose -f docker-compose.omniroute.yml up -d

version: '3.8'

services:
  # OmniRoute AI service
  omniroute:
    image: ghcr.io/omniroute/omniroute:latest
    container_name: omniroute
    restart: unless-stopped

    environment:
      - OMNIROUTE_PORT=20128
      - OMNIROUTE_HOST=0.0.0.0

    ports:
      - "20128:20128"

    volumes:
      - omniroute-data:/app/data

    networks:
      - whatsapp-bot-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # WhatsApp Ticket Bot
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: whatsapp-ticket-bot
    restart: unless-stopped

    depends_on:
      - omniroute

    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - TZ=UTC
      # Override AI_BASE_URL to use container name
      - AI_BASE_URL=http://omniroute:20128/v1

    volumes:
      - ./wa-session:/app/wa-session
      - ./logs:/app/logs
      - ./.wwebjs_cache:/app/.wwebjs_cache
      - ./.wwebjs_auth:/app/.wwebjs_auth

    ports:
      - "3000:3000"

    networks:
      - whatsapp-bot-network

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  whatsapp-bot-network:
    driver: bridge

volumes:
  omniroute-data:

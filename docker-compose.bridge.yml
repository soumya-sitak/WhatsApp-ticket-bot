# Alternative: Bridge network setup (if you prefer isolated networking)
# Use this if OmniRoute is NOT on localhost, or you want container isolation
# Run with: docker-compose -f docker-compose.bridge.yml up -d

version: '3.8'

services:
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: whatsapp-ticket-bot
    restart: unless-stopped

    # Environment variables
    env_file:
      - .env

    environment:
      - NODE_ENV=production
      - TZ=UTC

    # Persistent volumes
    volumes:
      - ./wa-session:/app/wa-session
      - ./logs:/app/logs
      - ./.wwebjs_cache:/app/.wwebjs_cache
      - ./.wwebjs_auth:/app/.wwebjs_auth

    # Expose ticket viewer port
    ports:
      - "3000:3000"

    # Use custom network (for linking with other containers)
    networks:
      - whatsapp-bot-network

    # Add extra hosts to reach host services
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Security options
    security_opt:
      - no-new-privileges:true

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  whatsapp-bot-network:
    driver: bridge
